[package]
name = "git-grab"
version = "0.11.0"
edition = "2021"
description = "Git-Grab: watches projects on GitHub, GitLab, Gitea and Forgejo for new releases and archives every file into per-site, per-project, per-version folders"
license = "GPL-3.0-only"
repository = "https://github.com/murderbymodem/Git-Grab"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
env_logger = "0.11"
hex = "0.4"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
