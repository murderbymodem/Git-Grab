# Git-Grab configuration
#
# Every file from each release is saved as:  <archive_root>/<Site>/<Project>/<tag>/<file>
# e.g.  \\nas\software\GitHub\ripgrep\14.1.0\ripgrep-14.1.0-x86_64-pc-windows-msvc.zip
# Site folders: GitHub, GitLab (gitlab.com), Codeberg, and the host name for any
# other site (rename it with `folder` in a [[site]] entry, below).

# Where the archive lives. Use single quotes so backslashes are kept as-is.
#   Windows share:  archive_root = '\\nas\software'
#   Linux mount:    archive_root = '/mnt/software'
archive_root = '/mnt/software'

# Extra folders that get a full copy of the archive, e.g. keep the main archive
# on this PC and mirror it to a network share. Files are downloaded once, into
# archive_root, then copied. A mirror that can't be reached is skipped and
# catches up on a later run. Old releases removed by keep_versions are removed
# from mirrors too (only folders this program created).
# mirrors = ['\\nas\software']

# GitHub login. The easiest way is to run `git-grab login`, which
# saves a token in the `token` file next to this config (encrypted for your
# Windows account on Windows; readable only by you on Linux).
# Logging in raises the API limit from 60 to 5000 requests/hour and lets the tool
# read your own starred repos. Alternatives: set GITHUB_TOKEN, or put a token here:
# github_token = "github_pat_..."

# For browser login (`login` shows a code to approve on github.com), set the client
# ID of a GitHub OAuth App with "Enable Device Flow" ticked. Without it, `login`
# asks you to paste a token instead.
# oauth_client_id = "Ov23li..."

# For GitHub Enterprise Server: api_url = "https://github.example.com/api/v3"
# api_url = "https://api.github.com"

# Minutes between checks when running `git-grab watch`.
# (On Windows, `task install` sets up an hourly scheduled task instead.)
interval_minutes = 360

# ---- Defaults for every repo (each can be overridden inside a [[repo]]) ----

# How many of the newest releases to archive.
releases = 1
# Include prereleases (betas, release candidates, nightlies).
include_prereleases = false
# With prereleases off: for a project that only publishes prereleases (e.g. just
# nightly builds), archive its newest prereleases instead of nothing.
prereleases_if_no_release = true
# Also save GitHub's auto-generated source zip (<Project>-<tag>-source.zip).
include_source = false
# Delete archived releases beyond the newest N. Leave out to keep everything.
# Only removes folders this tool created (tracked in <Project>/.git-grab.json).
# keep_versions = 5
# Every file in a release is downloaded. To skip some, list wildcard patterns
# (* and ?, case-insensitive). `include` does the opposite: only matching files.
# exclude = ["*.sbom.json", "*.sig"]
# include = ["*.zip", "*.msi"]
# Keep a copy of each project's README (e.g. ripgrep\README.md) so you can tell
# what a project is. Updated when it changes on GitHub.
save_readme = true

# ---- Other sites ----
# Any [[repo]] or [[account]] can be on GitLab, Gitea, Forgejo or Codeberg:
# paste a link to it. The kind of site is detected; to set it yourself (or add
# a token for private projects, or use `login --site`), add a [[site]] entry:
# [[site]]
# url = "https://git.magicbean.dev"
# type = "forgejo"      # "github" (Enterprise), "gitlab", "gitea" or "forgejo"
# folder = "MagicBean"  # the site's folder in the archive (default: its host name)
# token = "..."

# ---- Whole accounts ----
# Every project of a user or organization, on any site. New projects are
# picked up automatically. Same options as [starred].
# [[account]]
# url = "https://git.magicbean.dev/MagicBeanDev"
# ignore = ["MagicBeanDev/old-*"]
# include_forks = false

# ---- Starred repos ----
# Archive every repo starred by an account, in addition to the [[repo]] list.
# The list is re-read each run, so starring a repo on GitHub adds it automatically.
# Repos listed under [[repo]] keep their own settings.
[starred]
enabled = false
# user = "someone"          # whose stars; leave out to use the logged-in account
# ignore = ["someorg/*", "owner/huge-repo"]
# include_forks = true
# include_archived = true
# Delete a repo's archived files (here and in mirrors) once you unstar it.
# Repos also listed under [[repo]] or [[account]] are never removed.
# remove_unstarred = false
# Settings for starred repos only (override the defaults above):
# releases = 1
# exclude = ["*.tar.gz"]

# ---- Repositories ----

# owner/name for GitHub, or a link to a project on any supported site.
[[repo]]
repo = "BurntSushi/ripgrep"          # project folder defaults to the repo name: "ripgrep"

[[repo]]
repo = "PowerShell/PowerShell"
releases = 2
keep_versions = 2
include = ["*.msi", "*.zip"]          # only these files from this repo

[[repo]]
repo = "keepassxreboot/keepassxc"
folder = "KeePassXC"                 # custom project folder name
